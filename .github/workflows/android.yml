name: Android build

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle (cache)
        uses: gradle/actions/setup-gradle@v4

      # ubuntu-latest already ships the Android SDK (ANDROID_HOME); accept licences and install SDK 35.
      - name: Install Android SDK packages
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"

      - name: Unit tests
        run: |
          set +e
          ./gradlew testDebugUnitTest --stacktrace > gradle-test.log 2>&1
          rc=$?
          if [ $rc -ne 0 ]; then
            grep -E "^e: |FAILED|What went wrong|error:" -A2 gradle-test.log | head -40 | tr -d '\r' | while IFS= read -r l; do echo "::error::${l:0:400}"; done
            tail -15 gradle-test.log | while IFS= read -r l; do echo "::warning::${l:0:300}"; done
          fi
          exit $rc

      - name: Build debug APK
        run: |
          set +e
          ./gradlew assembleDebug --stacktrace > gradle-build.log 2>&1
          rc=$?
          if [ $rc -ne 0 ]; then
            grep -E "^e: |FAILED|What went wrong|error:" -A2 gradle-build.log | head -40 | tr -d '\r' | while IFS= read -r l; do echo "::error::${l:0:400}"; done
          fi
          exit $rc

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ultron-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      # Always upload reports so compile/test errors can be read and fixed.
      - name: Upload build + test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-reports
          path: |
            app/build/reports/
            app/build/test-results/
          if-no-files-found: ignore
